<!DOCTYPE html>
<html lang="en">
  <style>
    .eye-saver-overlay {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: calc(9e999);
      pointer-events: all;
    }

    .eye-saver-overlay-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .overlay-buttons {
      display: flex;
      gap: 48px;
    }

    .overlay-button {
      all: unset;
      width: 72px;
      padding: 8px 12px;
      border-radius: 8px;
      background-color: #29252d;
      color: #eae9eb;
      text-align: center;
      font-size: 18px;
      font-family: roboto-light, 'Roboto', 'open-sans' !important;
      font-weight: 400 !important;
      cursor: pointer;
    }
  </style>
  <body>
    <div class="eye-saver-overlay">
      <div class="eye-saver-overlay-content">
        <div class="eye-saver-timer-dropzone"></div>
        <div class="overlay-buttons">
          <button class="eye-saver-skip-button overlay-button">Skip</button>
          <button class="eye-saver-snooze-button overlay-button">Snooze</button>
        </div>
      </div>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
